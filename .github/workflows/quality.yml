name: REFLINK quality gates

on:
  pull_request:
    branches:
      - v2.0-release
  push:
    branches:
      - v2.0-release
      - reflink/phase-1-security-remediation

permissions:
  contents: read

concurrency:
  group: reflink-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
