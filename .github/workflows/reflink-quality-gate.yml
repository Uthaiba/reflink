name: REFLINK Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "reflink/**"

permissions:
  contents: read

concurrency:
  group: reflink-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  migration-integrity:
    name: Supabase migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staged migration files and exclude production data imports
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20261110063521_reconstruct_production_schema_in_staging.sql
            supabase/migrations/20261110063620_configure_private_referral_storage_and_realtime.sql
            supabase/migrations/20261110063704_add_staging_foreign_key_indexes_and_secure_views.sql
            supabase/migrations/20261110063756_optimize_rls_auth_context_evaluation.sql
            supabase/migrations/20261110063844_merge_equivalent_permissive_rls_policies.sql
            supabase/migrations/20261110063912_pin_security_definer_search_paths.sql
            supabase/migrations/20261110063935_explicitly_deny_client_access_to_internal_ledgers.sql
            supabase/migrations/20261110064010_harden_concurrent_referral_print_auditing.sql
            supabase/migrations/20261110064100_guard_forced_password_change_flag.sql
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done

          # Ignore INSERT statements inside PL/pgSQL function bodies. These are
          # application runtime operations, not migration-time production data imports.
          python3 - "${files[0]}" <<'PY'
          import pathlib
          import re
          import sys

          sql = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          sql_without_dollar_bodies = re.sub(
              r"(\$[A-Za-z_][A-Za-z0-9_]*\$|\$\$).*?\1",
              "",
              sql,
              flags=re.DOTALL,
          )
          if re.search(
              r"^[ \t]*(?:INSERT\s+INTO|COPY\s+)",
              sql_without_dollar_bodies,
              flags=re.IGNORECASE | re.MULTILINE,
          ):
              raise SystemExit(
                  "Baseline migration contains a top-level data import statement."
              )
          PY

          grep -Fq 'ALTER VIEW public.referral_analytics SET (security_invoker = true)' "${files[2]}"
          grep -Fq 'ALTER VIEW public.referral_analytics_summary SET (security_invoker = true)' "${files[2]}"
          grep -Fq "ALTER FUNCTION public.is_administrator() SET search_path = '';" "${files[5]}"
          grep -Fq "pg_advisory_xact_lock" "${files[7]}"
          grep -Fq "CREATE UNIQUE INDEX IF NOT EXISTS referral_print_events_referral_print_number_uidx" "${files[7]}"
          grep -Fq "NEW.must_change_password IS DISTINCT FROM OLD.must_change_password" "${files[8]}"
          echo "Migration integrity checks passed."
